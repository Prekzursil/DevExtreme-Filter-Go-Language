name: codeql

permissions: {}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  CodeQL:
    name: CodeQL
    needs: analyze
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify analyses succeeded
        run: |
          if [[ "${{ needs.analyze.result }}" != "success" ]]; then
            echo "One or more CodeQL analyses failed: ${{ needs.analyze.result }}"
            exit 1
          fi
          echo "All CodeQL analyses succeeded."
