name: SonarCloud Scan

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Shallow clones disable Sonar's blame information; fetch full history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: |
          set +e  # Avoid pipefail killing debug pipes (head closing pipe early).
          packages=$(go list ./... | grep -vE "/ent($|/)")
          # Run each test package in isolation so its coverage profile
          # is written without -coverpkg cross-instrumentation that
          # leaves OTHER packages' statements at 0 hits in the merged
          # profile. Build per-package profiles, then concatenate.
          rm -f coverage.out
          first=1
          for pkg in $packages; do
            go test "$pkg" -coverprofile=coverage_part.out -covermode=count || true
            if [ -f coverage_part.out ]; then
              if [ "$first" -eq 1 ]; then
                cp coverage_part.out coverage.out
                first=0
              else
                tail -n +2 coverage_part.out >> coverage.out
              fi
              rm -f coverage_part.out
            fi
          done
          # SonarCloud's Go scanner resolves file paths via the import
          # path embedded in coverage.out lines (e.g.
          # ``transaction-filter-backend/main.go``). KEEP the module
          # prefix and rely on the project key + sonar.sources=. to
          # let the scanner walk the import path back to disk. Stripping
          # the prefix earlier produced \`time=37ms\` parser fast-paths
          # that didn't apply any data.
          if [ -f coverage.out ]; then
            echo "=== coverage.out: $(wc -l < coverage.out) lines ==="
            head -3 coverage.out
            echo "=== covered files ==="
            awk '{print $1}' coverage.out | grep -oE '^[^:]+' | sort -u | head -10
          fi

      - name: SonarCloud Scan
        # The 40-hex value after @ is the SonarSource sonarqube-scan-action's
        # git commit SHA (required by Codacy's
        # third-party-action-not-pinned-to-commit-sha rule). Semgrep's
        # secrets.sonarqube-docs-api-key rule matches the same 40-hex shape
        # and flags this as a hardcoded API key — that's a false positive
        # because git commit SHAs and SonarQube API keys share the same
        # 40-hex shape but only one of those (the API key) carries
        # credential value.
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4  # v7.1.0  # nosemgrep
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
