name: SonarCloud Scan

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Shallow clones disable Sonar's blame information; fetch full history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: |
          packages=$(go list ./... | grep -vE "/ent($|/)")
          # -coverpkg covers ALL listed packages from each test so
          # cross-package coverage gets recorded in the combined output.
          coverpkg=$(echo "$packages" | tr '\n' ',' | sed 's/,$//')
          go test $packages -coverprofile=coverage.out -covermode=count -coverpkg="$coverpkg" || true
          # Debug: dump first 5 lines + size so we can see what the
          # SonarCloud scanner is receiving.
          if [ -f coverage.out ]; then
            echo "=== coverage.out: $(wc -l < coverage.out) lines, $(wc -c < coverage.out) bytes ==="
            head -5 coverage.out
            echo "=== sample non-zero hits ==="
            grep -v ' 0$' coverage.out | head -3
          fi
          # Strip the Go module-path prefix from coverage.out so
          # SonarCloud's Go scanner can resolve paths against
          # sonar.sources=. (repo root).
          if [ -f coverage.out ]; then
            sed -i 's|^transaction-filter-backend/||' coverage.out
            echo "=== After sed strip ==="
            head -5 coverage.out
          fi

      - name: SonarCloud Scan
        # The 40-hex value after @ is the SonarSource sonarqube-scan-action's
        # git commit SHA (required by Codacy's
        # third-party-action-not-pinned-to-commit-sha rule). Semgrep's
        # secrets.sonarqube-docs-api-key rule matches the same 40-hex shape
        # and flags this as a hardcoded API key — that's a false positive
        # because git commit SHAs and SonarQube API keys share the same
        # 40-hex shape but only one of those (the API key) carries
        # credential value.
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5  # nosemgrep
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
