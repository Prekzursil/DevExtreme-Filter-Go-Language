sonar.organization=prekzursil
sonar.projectKey=Prekzursil_DevExtreme-Filter-Go-Language
sonar.projectName=DevExtreme-Filter-Go-Language

sonar.sources=.
sonar.tests=
sonar.test.inclusions=**/*_test.go,**/transaction_filter_test.go

sonar.exclusions=.github/**,scripts/quality/**,scripts/security_helpers.py,SECURITY.md,.qlty/**,ent/**
sonar.cpd.exclusions=.github/**,scripts/quality/**,scripts/security_helpers.py,SECURITY.md,.qlty/**,ent/**

sonar.go.coverage.reportPaths=coverage.out
# Sonar Generic Test Coverage XML — converted from coverage.out so the
# path resolution is deterministic (filename attribute = relative path
# from project root, matching indexed files exactly).  Avoids the 39ms
# silent-drop pattern where the Go Cover sensor's path resolver returns
# null for every entry despite valid Go cover data.
sonar.coverageReportPaths=coverage-sonar.xml
sonar.coverage.exclusions=ent/**,**/*_test.go,scripts/**,main_prod.go
