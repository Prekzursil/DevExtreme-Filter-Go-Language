config_version = "0"

[[source]]
name = "default"
default = true

# ``ent/`` is auto-generated by ``entgo`` (entgo.io ORM). The files are
# regenerated on every schema change via ``go generate ./ent`` and we
# don't author them by hand. Excluding them from qlty's smell analysis
# matches the existing exclusion in ``profiles/repos/devextreme-filter-go-language.yml``
# coverage command (``go list ./... | grep -vE "/ent($|/)"``). This is a
# scope correction, not an analyzer disable: real code under ``main.go``,
# ``schematool/``, ``dynamictablefilter/`` etc. continues to be analyzed.
[[ignore]]
file_patterns = [
    # Auto-generated by entgo - regenerated via go generate ./ent
    "ent/**",
    "ent/**/*.go",
    # Vendored Python platform scripts - owned by Prekzursil/quality-zero-platform
    # and tested there. devextreme COPIES them via the platform bootstrap workflow
    # but does not author or test them. Excluding them from qlty smell analysis
    # matches the existing exclusion in sonar-project.properties.
    "scripts/quality/**",
    "scripts/security_helpers.py",
    # Minified, hash-named SPA bundles served by the Go backend. These are
    # produced by the React build pipeline (Vite/Webpack), not authored here.
    # The TS sources that generated them live in the upstream UI repo and are
    # analyzed there. Smell metrics on minified output are pure noise.
    "static/**",
    "static/app/**",
]

[smells]
mode = "block"
