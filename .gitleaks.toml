# gitleaks configuration for the lean secrets gate (pinned tool: gitleaks 8.30.1).
# Runs via pre-commit over the working tree and must report 0 findings.
# Extends the upstream default ruleset; only path/match allowlists for generated
# trees and reasoned fixtures are added (no real secrets).
title = "devextreme-filter-go-language lean secrets gate"

[extend]
useDefault = true

[allowlist]
description = "Generated code, build artifacts, and vendored trees (not real secrets)."
paths = [
  '''(^|/)ent/''',
  '''(^|/)vendor/''',
  '''(^|/)static/''',
  '''(^|/)\.qlty/''',
  '''(^|/)\.git/''',
  '''(^|/)tests\.exe$''',
  '''(^|/)test_output\.log$''',
]
