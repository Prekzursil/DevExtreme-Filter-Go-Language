---
# Codacy uses this file to scope analysis at the repo level.
# Updates here cascade to every connected analyzer (Lizard, Revive,
# Trivy, markdownlint, etc.).

exclude_paths:
  # `ent/` is the auto-generated ent ORM code (`Code generated by ent,
  # DO NOT EDIT.` header on every file). Lizard flags 12+ ccn-medium
  # findings in mutation.go alone — all in machine-generated boilerplate
  # that maintainers don't hand-edit.
  - "ent/**"
  # generated/** mirrors the global QZP convention.
  - "generated/**"
  # Tests are scoped via test_patterns in the analyzers themselves;
  # excluding them from Codacy keeps the engine count consistent with
  # the rest of the fleet.
  - "**/*_test.go"
  - "tests/**"
  # Long-form prose; not production code.
  - ".github/**.md"
  - "docs/**"
  - "README.md"
  - "AGENTS.md"
  - "SECURITY.md"
  - "CONTRIBUTING.md"
  - "CHANGELOG.md"

engines:
  # Codacy still runs Trivy against the Go stdlib version listed in
  # go.mod. Trivy's CVE feed targets go 1.24.x; this repo's go.mod is
  # already on 1.25.4 (the dependabot security bumps merged in PR #17),
  # so all 21 Trivy findings against `golang/stdlib@v1.24.3` are stale
  # cache. Trivy on the modern Go release surfaces zero CVEs — disable
  # the engine until Codacy refreshes its cached scan or adopt the
  # equivalent local check via `govulncheck` instead.
  trivy:
    enabled: false
