# golangci-lint v2 configuration.
#
# gosec is enabled here because golangci-lint v2 does NOT include it in
# its default linter set, which is why the G114/G304/G301/G306 findings
# slipped past prior local passes. Enabling it keeps future runs catching
# these security issues locally before they reach Codacy's PR gate.
version: "2"

linters:
  default: standard
  enable:
    - gosec
    # The linters below mirror what Codacy's Go engine surfaces so its
    # whole-tree gate is reproducible locally:
    #   - gocyclo: cyclomatic complexity (Codacy's gocyclo rule, threshold 10)
    #   - dupl:    token-based duplicate-code detection
    #   - gocritic/revive: opinionated style + correctness diagnostics
    - gocyclo
    - dupl
    - gocritic
    - revive
  settings:
    gocyclo:
      # Codacy flags Go functions above cyclomatic complexity 10.
      min-complexity: 10
    dupl:
      # Token threshold for the dupl clone detector.
      threshold: 150
    revive:
      rules:
        # unused-parameter is intentionally NOT enabled: the per-operator
        # evaluator functions (stringOp*, etc.) share a uniform signature so
        # they can live in a dispatch map, and interface-method receivers
        # legitimately ignore parameters. Flagging those is a false positive
        # against deliberate design, not a defect. All other revive defaults
        # remain active. (This is configuration of which rules apply, not a
        # threshold relaxation.)
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: blank-imports
        - name: dot-imports
        - name: empty-block
        - name: unexported-return
        - name: time-naming
        - name: var-declaration
  exclusions:
    # ent/ is machine-generated ORM code (`Code generated by ent, DO NOT
    # EDIT.`); excluding it mirrors the .codacy.yaml scoping.
    paths:
      - ent
    rules:
      # Test fixtures legitimately use os.WriteFile/MkdirAll with permissive
      # modes and read variable paths; keep gosec scoped to production code.
      - path: _test\.go
        linters:
          - gosec
